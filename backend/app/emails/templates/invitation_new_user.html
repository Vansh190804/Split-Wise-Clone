<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            font-family: Arial;
            background:#f5f5f5;
            padding:40px;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:12px;
            max-width:600px;
            margin:auto;
        }

        .button{
            background:#4F46E5;
            color:white;
            font: Arial;
            padding:12px 20px;
            border-radius:8px;
            text-decoration:none;
        }
        .button-text{
            font-family: Arial;
            color:white;
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Hello!</h2>

    <p>
        <b>{{ sender_name }}</b>
        invited you to join Splitwise.
    </p>

    <p>
        Click below to accept the invitation.
    </p>

    <a class="button" href="{{ invite_link }}">
        <span class="button-text">Join Spliwise</span>
    </a>

</div>

</body>

</html>
